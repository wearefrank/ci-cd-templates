name: Release

on:
  push:
    branches:
      - main

jobs:
  actionlinter:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
        
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.1
        with:
          options: -v $(pwd):/repo --workdir /repo
          args: -color

  release:
    runs-on: ubuntu-latest
    needs: 
      - actionlinter
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          token: ${{ secrets.WEAREFRANK_BOT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #7.1.0
        with:
          node-version: lts/*
      
      - name: Install dependencies
        run: corepack yarn --cwd .github/semantic-release install --frozen-lockfile
      
      - name: Semantic Release
        run: ./.github/semantic-release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.WEAREFRANK_BOT_PAT }}
          GH_TOKEN: ${{ secrets.WEAREFRANK_BOT_PAT }}
